name: Build MROffline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-path || true
          clang++ --version || true

      - name: Install Theos (logos only 需要)
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS
          # 只要 logos.pl，不用它的 SDK 和打包
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          ls -la $THEOS/bin/ | head -30
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install ldid
        run: brew install ldid || true

      - name: Preprocess Tweak.xm
        run: |
          set -euo pipefail
          export THEOS=$HOME/theos
          if [ -x "$THEOS/bin/logos.pl" ]; then
            perl "$THEOS/bin/logos.pl" Tweak.xm > Tweak.mm
          else
            echo "logos.pl not found, listing:"; find $THEOS -name 'logos*' | head -20; exit 1
          fi
          echo "--- head ---"; head -40 Tweak.mm
          echo "--- grep ctor ---"; grep -n "ctor\|MROfflineProtocol" Tweak.mm | head -20

      - name: Compile dylib
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "SDK=$SDK"
          mkdir -p out

          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -miphoneos-version-min=14.0 \
            -isysroot "$SDK" \
            -fobjc-arc -O2 \
            -dynamiclib \
            -install_name @executable_path/MROffline.dylib \
            -framework Foundation -framework UIKit -framework CoreFoundation \
            -o out/MROffline.dylib \
            Tweak.mm

          echo "=== built ==="
          ls -la out/

      - name: Verify
        run: |
          set -x
          file out/MROffline.dylib
          otool -L out/MROffline.dylib
          otool -arch arm64 -h out/MROffline.dylib | head -20
          echo "=== ctor ==="
          otool -l out/MROffline.dylib | grep -A6 __mod_init_func || true
          echo "=== exported classes ==="
          nm -m out/MROffline.dylib | grep -i "MROffline" | head -20 || true
          echo "=== strings check ==="
          strings out/MROffline.dylib | grep -c "MROFFLINE" || true
          strings out/MROffline.dylib | grep "hestia" | head -5 || true

      - name: Sign
        run: |
          set -e
          ldid -S out/MROffline.dylib
          cp out/MROffline.dylib out/MROffline_signed.dylib
          ls -la out/

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mroffline-dylib
          path: |
            out/
            Tweak.mm
          if-no-files-found: warn
