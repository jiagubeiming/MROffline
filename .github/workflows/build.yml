name: Build MROffline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Install ldid
        run: |
          brew install ldid || true

      - name: Install iOS SDK
        run: |
          mkdir -p $THEOS/sdks
          cd $THEOS/sdks
          for v in 16.5 15.6 14.5; do
            echo "trying iPhoneOS$v.sdk"
            curl -fL -o sdk.zip "https://github.com/theos/sdks/raw/master/iPhoneOS$v.sdk.zip" && \
              unzip -q -o sdk.zip && rm -f sdk.zip && echo "got $v" && break
          done
          ls -1

      # 直接用 clang 编译 dylib，绕开 Theos 的 stage/packaging 阶段。
      # 这样产出的就是一个可注入的 .dylib，不依赖 .deb 打包。
      - name: Compile dylib (rootless)
        run: |
          set -euo pipefail
          export THEOS=$HOME/theos
          SDK=$(ls -d $THEOS/sdks/iPhoneOS*.sdk | head -1)
          echo "SDK=$SDK"
          mkdir -p out

          # 用 Theos 的 preprocessor 把 .xm 转成 .mm（%ctor/%hook 宏展开）
          $THEOS/bin/logos.pl Tweak.xm > Tweak.mm
          echo "--- preprocessed head ---"
          head -40 Tweak.mm

          xcrun --sdk iphoneos clang++ \
            -arch arm64 \
            -miphoneos-version-min=15.0 \
            -isysroot "$SDK" \
            -fobjc-arc -O2 -fmodules \
            -dynamiclib \
            -install_name @executable_path/MROffline.dylib \
            -framework Foundation -framework UIKit -framework CoreFoundation \
            -o out/MROffline.dylib \
            Tweak.mm 2>&1 | tee compile.log

          ls -la out/

      - name: Verify dylib
        run: |
          set -x
          file out/MROffline.dylib || true
          xcrun --sdk iphoneos otool -L out/MROffline.dylib || true
          xcrun --sdk iphoneos otool -h out/MROffline.dylib || true
          # 列出初始化函数，确认 %ctor 存在
          xcrun --sdk iphoneos nm -m out/MROffline.dylib | grep -i -E "ctor|MROffline" || true
          xcrun --sdk iphoneos otool -l out/MROffline.dylib | grep -A4 __mod_init_func || true

      - name: Sign dylib
        run: |
          set -e
          ldid -S out/MROffline.dylib && echo "signed ok"
          cp out/MROffline.dylib out/MROffline_signed.dylib

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mroffline-dylib
          path: |
            out/
            compile.log
            Tweak.mm
          if-no-files-found: warn
